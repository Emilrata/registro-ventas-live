<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ventas LIVE</title>
    <meta name="description" content="Registro de pedidos de transmisiones LIVE. Funciona sin internet." />
    <meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ventas LIVE" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div class="app">
      <header class="barra-superior">
        <div class="marca" id="marca"><span class="marca__nombre">Ventas LIVE</span></div>
        <div class="barra-superior__acciones">
          <span class="sin-conexion" id="sin-conexion" role="status" hidden></span>
          <button class="boton-icono" id="boton-bloquear" type="button" aria-label="Bloquear la app" hidden></button>
        </div>
      </header>
      <main class="vista" id="vista" tabindex="-1">
        <noscript>Esta app necesita JavaScript activado.</noscript>
      </main>
      <nav class="nav" id="navegacion" aria-label="Navegación principal"></nav>
    </div>
    <div class="acceso" id="acceso" hidden></div>
    <div class="avisos" id="avisos" aria-live="polite"></div>
    <script>
      // Teléfonos o navegadores demasiado antiguos: mensaje claro en vez de una pantalla en blanco.
      (function () {
        var faltan = !('indexedDB' in window) || !(window.crypto && window.crypto.subtle) ||
          typeof HTMLDialogElement === 'undefined' || !('showModal' in HTMLDialogElement.prototype) ||
          !Array.prototype.at || typeof Promise === 'undefined';
        if (!faltan) return;
        window.__navegadorAntiguo = true;
        document.addEventListener('DOMContentLoaded', function () {
          document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:32px 20px;max-width:480px;margin:auto;line-height:1.5">' +
            '<h1 style="font-weight:400">Hay que actualizar el navegador</h1>' +
            '<p>Este teléfono o navegador es muy antiguo para la app.</p>' +
            '<ul><li>iPhone o iPad: actualiza a iOS 15.4 o más nuevo (Ajustes → General → Actualización de software) y usa Safari.</li>' +
            '<li>Android: actualiza Google Chrome desde Play Store.</li></ul></div>';
        });
      })();
    </script>
    <script nomodule>document.addEventListener('DOMContentLoaded', function () { document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">Este navegador es muy antiguo para la app. Actualiza tu teléfono o usa Google Chrome.</p>'; });</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
